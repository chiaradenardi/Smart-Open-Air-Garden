openapi: 3.0.0
info:
  title: Smart Open Air Garden - Service Catalog API
  description: Central catalog service for device, broker, and plant configuration management
  version: 1.0.0
  contact:
    name: Smart Open Air Garden Project
  license:
    name: MIT

servers:
  - url: http://service-catalog:8080
    description: Service Catalog Server

tags:
  - name: Broker
    description: MQTT Broker configuration endpoints
  - name: Price
    description: Water pricing endpoints
  - name: Slots
    description: Garden slot management endpoints
  - name: Devices
    description: Device information endpoints
  - name: Location
    description: Location/weather configuration endpoints

paths:
  /broker:
    get:
      tags:
        - Broker
      summary: Get MQTT Broker Configuration
      description: Retrieve MQTT broker hostname and port for device connections
      operationId: getBrokerConfig
      responses:
        '200':
          description: Broker configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerConfig'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /price:
    get:
      tags:
        - Price
      summary: Get Water Price
      description: Retrieve current water price per cubic meter
      operationId: getWaterPrice
      responses:
        '200':
          description: Water price retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: number
                    description: Water price in €/m³
                required: [price]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Price
      summary: Update Water Price
      description: Update the water price per cubic meter
      operationId: updateWaterPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NewWaterPricePerM3:
                  type: number
                  description: New water price in €/m³
              required: [NewWaterPricePerM3]
      responses:
        '200':
          description: Water price updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  result:
                    type: string
                  newPrice:
                    type: number
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /slots:
    get:
      tags:
        - Slots
      summary: Get All Garden Slots
      description: Retrieve all garden slots configuration
      operationId: getAllSlots
      responses:
        '200':
          description: Garden slots retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GardenSlot'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Slots
      summary: Create Garden Slot
      description: Create a new garden slot with device and plant association
      operationId: createSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slotID:
                  type: string
                  description: Unique slot identifier
                plantID:
                  type: string
                  description: Plant/crop identifier
                deviceID:
                  type: string
                  description: Associated device ID (RPi_XXX)
              required: [slotID, plantID, deviceID]
      responses:
        '201':
          description: Garden slot created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  result:
                    type: string
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - duplicate slot ID or device already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /slots/{slotID}:
    get:
      tags:
        - Slots
      summary: Get Garden Slot by ID
      description: Retrieve a specific garden slot configuration by slot ID
      operationId: getSlot
      parameters:
        - name: slotID
          in: path
          required: true
          schema:
            type: string
          description: Garden slot identifier
      responses:
        '200':
          description: Garden slot retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenSlot'
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Slots
      summary: Update Garden Slot
      description: Update plant association for a garden slot
      operationId: updateSlot
      parameters:
        - name: slotID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slotID:
                  type: string
                plantID:
                  type: string
              required: [slotID, plantID]
      responses:
        '200':
          description: Garden slot updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenSlot'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Slots
      summary: Delete Garden Slot
      description: Remove a garden slot from the catalog
      operationId: deleteSlot
      parameters:
        - name: slotID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Garden slot deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  result:
                    type: string
        '404':
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/{deviceID}:
    get:
      tags:
        - Devices
      summary: Get Device Information
      description: Retrieve configuration and metadata for a specific device
      operationId: getDevice
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
          description: Device identifier (e.g., RPi_001)
      responses:
        '200':
          description: Device information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /location:
    get:
      tags:
        - Location
      summary: Get Location Configuration
      description: Retrieve the configured location for weather services
      operationId: getLocation
      responses:
        '200':
          description: Location retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                    description: Location string (e.g., "Turin,IT")
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    BrokerConfig:
      type: object
      properties:
        broker_name:
          type: string
          description: Broker hostname or IP address
        broker_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: MQTT broker port (default 1883)
      required: [broker_name, broker_port]
      example:
        broker_name: "message-broker"
        broker_port: 1883

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
          description: Error code (e.g., VALIDATION_ERROR, NOT_FOUND, CONFLICT)
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
          additionalProperties: true
      required: [status, code, message]

    GardenSlot:
      type: object
      properties:
        slotID:
          type: string
        slotName:
          type: string
        plantID:
          type: string
        deviceID:
          type: string
        lastUpdate:
          type: string
          format: date-time
      required: [slotID, plantID, deviceID]

    DeviceInfo:
      type: object
      properties:
        deviceID:
          type: string
        config:
          type: object
          properties:
            clientID:
              type: string
        lastUpdate:
          type: string
          format: date-time
      required: [deviceID]
