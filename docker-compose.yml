services:

  message-broker:
    image: eclipse-mosquitto:latest
    container_name: message-broker
    ports:
      - "1883:1883"
      - "9001:9001"

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    depends_on:
      - message-broker
    volumes:
      - ./node_red_data:/data
  
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "davide"
      DOCKER_INFLUXDB_INIT_PASSWORD: "Progetto1234"
      DOCKER_INFLUXDB_INIT_ORG: "SmartGarden"
      DOCKER_INFLUXDB_INIT_BUCKET: "telemetry_data"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "dOzXCt01RpXm58Zh_Twn57mRkeRttHvtmbJi6FdPdM0kJh4D-7t2ldF2Ni8YeUg8QCXCqShqC6xMn8IViISstA=="
    restart: always

  weather-service-adaptor:
    build: ./weather_service_adaptor
    container_name: weather-service-adaptor
    environment:
      - TOMORROW_API_KEY=vl2kNb5ZvcIWSMqS7oGfKgOzLTOd7FXf
      - CITY_NAME=44.6458,10.9257
    ports:
      - "8085:8085"
    depends_on:
      - service-catalog
  
  smart-irrigation-service:
    build: ./SmartIrrigationService
    container_name: smart-irrigation-service
    environment:
      - PYTHONUNBUFFERED=1  
    depends_on:
      - message-broker
      - service-catalog
      - weather-service-adaptor
    restart: always

  service-catalog:
    build: ./service_catalog
    container_name: service-catalog
    ports:
      - "8080:8080"
    volumes:
      - ./service_catalog/catalogManager.json:/app/catalogManager.json
    restart: always
  
  influx-adaptor:
    build: ./influx_adaptor
    container_name: influx-adaptor
    ports:
      - "8081:8081"
    depends_on:
      - message-broker
      - service-catalog
      - influxdb
    restart: always


  statistics-service:
    build: ./statistics-service
    container_name: statistics-service
    ports:
      - "8082:8082"
    environment:
      - INFLUX_ADAPTOR_URL=http://influx-adaptor:8081
    depends_on:
      - influx-adaptor
      - influxdb
    restart: always

  telegram_bot:
    build:
      context: ./Telegram_Bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    env_file:
      - ./Telegram_Bot/.env
    environment:
      - BROKER_IP=message-broker
      - SLOTS_URL=http://service-catalog:8080/slots
      - CATALOG_URL=http://service-catalog:8080
      - STATISTICS_URL=http://statistics-service:8082
    depends_on:
      - message-broker
      - service-catalog
    restart: always

  fault-detection-service:
    build: ./fault-detection-service
    container_name: fault-detection-service
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - message-broker
    restart: always

  device-connector:
    build: ./device_connector
    image: smart-open-air-garden-device-connector
    container_name: device-connector
    environment:
      - CATALOG_URL=http://service-catalog:8080/broker
      - DEVICE_ID=RPi_001
    depends_on:
      - message-broker
      - service-catalog
    restart: always

  device-connector-02:
    build: ./device_connector
    image: smart-open-air-garden-device-connector
    container_name: device-connector-02
    environment:
      - CATALOG_URL=http://service-catalog:8080/broker
      - DEVICE_ID=RPi_002
    depends_on:
      - message-broker
      - service-catalog
    restart: always

  device-connector-03:
    build: ./device_connector
    image: smart-open-air-garden-device-connector
    container_name: device-connector-03
    environment:
      - CATALOG_URL=http://service-catalog:8080/broker
      - DEVICE_ID=RPi_003
    depends_on:
      - message-broker
      - service-catalog
    restart: always

volumes:
  node_red_data:
  node_red_modules: