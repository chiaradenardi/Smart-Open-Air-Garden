services:

  message-broker:
    image: eclipse-mosquitto:latest
    container_name: message-broker
    ports:
      - "1883:1883"
      - "9001:9001"

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    depends_on:
      - message-broker
    volumes:
      - ./node_red_data:/data
  
  weather-service-adaptor:
    build: ./weather_service_adaptor
    container_name: weather-service-adaptor
    environment:
      - TOMORROW_API_KEY=vl2kNb5ZvcIWSMqS7oGfKgOzLTOd7FXf
      - CITY_NAME=44.6458,10.9257
    ports:
      - "8085:8085"
    depends_on:
      - service-catalog
  
  smart-irrigation-service:
    build: ./SmartIrrigationService
    container_name: smart-irrigation-service
    environment:
      - PYTHONUNBUFFERED=1  
    depends_on:
      - message-broker
      - service-catalog
      - weather-service-adaptor
    restart: always

  service-catalog:
    build: ./service_catalog
    container_name: service-catalog
    ports:
      - "8080:8080"
    volumes:
      - ./service_catalog/catalogManager.json:/app/catalogManager.json
    restart: always
  
  influx-adaptor:
    build: ./influx_adaptor
    container_name: influx-adaptor
    environment:
      - INFLUX_URL=https://us-east-1-1.aws.cloud2.influxdata.com
      - INFLUX_TOKEN=u66UJ0P2mY0WxolaK1-dqhn6Kl70Q1LDuMcsL_28Jej0FnUoiH31VHzpz6O73Z2gNqfakdWYPhOoSd1aVNKdAA==
      - INFLUX_ORG=e5fa79d45d607722
      - INFLUX_BUCKET=garden_metrics
    ports:
      - "8081:8081"
    depends_on:
      - message-broker
      - service-catalog
    restart: always


  statistics-service:
    build: ./statistics-service
    container_name: statistics-service
    ports:
      - "8082:8082"
    environment:
      - INFLUX_ADAPTOR_URL=http://influx-adaptor:8081
      - CATALOG_URL=http://service-catalog:8080
    depends_on:
      - influx-adaptor
      - service-catalog
    restart: always

  telegram_bot:
    build:
      context: ./Telegram_Bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    env_file:
      - ./Telegram_Bot/.env
    environment:
      - BROKER_IP=message-broker
      - CATALOG_URL=http://service-catalog:8080
      - STATISTICS_URL=http://statistics-service:8082
      - INFLUX_ADAPTOR_URL=http://influx-adaptor:8081
    depends_on:
      - message-broker
      - service-catalog
    restart: always

  fault-detection-service:
    build: ./fault-detection-service
    container_name: fault-detection-service
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - message-broker
    restart: always

  # Dynamic Unified Device Connector Simulator (Auto-simulates all active garden devices)
  device-connector:
    build: ./device_connector
    image: smart-open-air-garden-device-connector
    container_name: device-connector
    environment:
      - CATALOG_URL=http://service-catalog:8080
      - PYTHONUNBUFFERED=1
    depends_on:
      - message-broker
      - service-catalog
    restart: always

volumes:
  node_red_data:
  node_red_modules: